name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test public data and page models
        run: npm test
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check resource calculator and encyclopedia layouts
        run: node tests/browser/run.cjs resource-flows catalog-flows growth-flows
      - name: Preserve browser check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: output/playwright/
          if-no-files-found: ignore
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css beast-seal*.js beast-seal.css encyclopedia*.js growth*.js growth.css resource*.js resource.css .nojekyll _site/
          cp -R assets api _site/
      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            // Use the uploader's artifact ID because the name lookup can miss a completed upload.
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error('The Pages upload did not return an artifact ID.');
            }
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo,
              artifact_id: artifactId,
              pages_build_version: context.sha,
              oidc_token: await core.getIDToken(),
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            const failed = new Set(['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost']);
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                ...context.repo,
                pages_deployment_id: deploymentId,
              });
              if (data.status === 'succeed') {
                core.setOutput('page_url', deployment.page_url);
                return;
              }
              if (failed.has(data.status)) throw new Error(`Pages deployment: ${data.status}`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages deployment did not report success within ten minutes.');
